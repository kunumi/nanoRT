[package]
name = "rustler"
version = "1.0.0"
edition = "2024"

[lib]
name = "rustler"
crate-type = ["cdylib"]

[dependencies]
serde_json = "*"
itertools = "*"
rand = "0.9.1"
pyo3 = { version = "*", features = ["abi3-py312"] }
memmap2 = "*"
rkyv = "*"
numpy = { version = "*", features = ["half"] }
half = { version = "*", features = ["rkyv"] }
