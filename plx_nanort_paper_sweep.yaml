version: 1.1
kind: operation
name: nanort-paper-screen
description: >
  Pre-registered three-seed screen for the nanoRT paper. Six paired arms isolate
  AdamW, Muon, column SIGReg, and simplicial attention. See
  docs/POLYAXON_SWEEP_PLAN.md before launching or changing this matrix.
#
# Required before launch:
#   export HF_DATASET_SHA=<immutable revision of gabrielveloso/nanort-artifacts>
#   polyaxon run -f plx_nanort_paper_sweep.yaml -u \
#     -P hf_artifacts_revision=$HF_DATASET_SHA -P hf_token=$HF_TOKEN
matrix:
  kind: mapping
  concurrency: 3
  values:
    # A: maintained AdamW RT baseline.
    - {optimizer: adamw, simplicial_layers: none, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-a-adamw-rt, seed: 0}
    - {optimizer: adamw, simplicial_layers: none, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-a-adamw-rt, seed: 1}
    - {optimizer: adamw, simplicial_layers: none, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-a-adamw-rt, seed: 2}
    # B: Muon only.
    - {optimizer: muon, simplicial_layers: none, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-b-muon, seed: 0}
    - {optimizer: muon, simplicial_layers: none, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-b-muon, seed: 1}
    - {optimizer: muon, simplicial_layers: none, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-b-muon, seed: 2}
    # C: Muon + column SIGReg.
    - {optimizer: muon, simplicial_layers: none, sigreg_layer: 0, sigreg_lambda_col: 0.001, checkpoint_prefix: paper-c-muon-sigreg, seed: 0}
    - {optimizer: muon, simplicial_layers: none, sigreg_layer: 0, sigreg_lambda_col: 0.001, checkpoint_prefix: paper-c-muon-sigreg, seed: 1}
    - {optimizer: muon, simplicial_layers: none, sigreg_layer: 0, sigreg_lambda_col: 0.001, checkpoint_prefix: paper-c-muon-sigreg, seed: 2}
    # D: cumulative champion, Muon + column SIGReg + simplicial.
    - {optimizer: muon, simplicial_layers: all, sigreg_layer: 0, sigreg_lambda_col: 0.001, checkpoint_prefix: paper-d-champion, seed: 0}
    - {optimizer: muon, simplicial_layers: all, sigreg_layer: 0, sigreg_lambda_col: 0.001, checkpoint_prefix: paper-d-champion, seed: 1}
    - {optimizer: muon, simplicial_layers: all, sigreg_layer: 0, sigreg_lambda_col: 0.001, checkpoint_prefix: paper-d-champion, seed: 2}
    # E: simplicial without SIGReg, required interaction control.
    - {optimizer: muon, simplicial_layers: all, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-e-simplicial-no-sigreg, seed: 0}
    - {optimizer: muon, simplicial_layers: all, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-e-simplicial-no-sigreg, seed: 1}
    - {optimizer: muon, simplicial_layers: all, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-e-simplicial-no-sigreg, seed: 2}
    # F: simplicial with AdamW, required optimizer interaction control.
    - {optimizer: adamw, simplicial_layers: all, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-f-adamw-simplicial, seed: 0}
    - {optimizer: adamw, simplicial_layers: all, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-f-adamw-simplicial, seed: 1}
    - {optimizer: adamw, simplicial_layers: all, sigreg_layer: -1, sigreg_lambda_col: 0.0, checkpoint_prefix: paper-f-adamw-simplicial, seed: 2}
params:
  holdout_db:                 {value: rel-avito}
  hf_artifacts_repo:          {value: gabrielveloso/nanort-artifacts}
  hf_artifacts_revision:      {value: REPLACE_WITH_IMMUTABLE_HF_DATASET_COMMIT}
  hf_checkpoint_repo:         {value: GabrielVeloso/NanoRT}
  hf_checkpoint_repo_type:    {value: model}
  wandb_project:              {value: nanort-paper-sweep}
  batch_size:                 {value: 256}
  max_steps:                  {value: 1000000}
  lr_total_steps:             {value: 0}
  time_budget_minutes:        {value: 45}
  lr:                         {value: 0.001}
  muon_lr:                    {value: 0.005}
  muon_warmup_steps:          {value: 3000}
  update_relations:           {value: "0"}
  qk_norm:                    {value: "1"}
  simplicial_layerscale_init: {value: 1.0}
  sigreg_lambda_row:          {value: 0.0}
  sigreg_n_proj:              {value: 64}
  sigreg_lr:                  {value: 0.0}
  sigreg_min_group:           {value: 8}
  sigreg_col_pool:            {value: 1}
  val_eval_freq:              {value: 100}
  eval_at_step0:              {value: "1"}
  eval_at_step1:              {value: "0"}
  val_eval_dense_until:       {value: 0}
  val_eval_dense_freq:        {value: 5}
pathRef: ./plx_nanort_train.yaml
