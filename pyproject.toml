[project]
name = "rt"
requires-python = "==3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
rt = { path = ".", editable = true }
torch = "==2.6.0"
wandb = "*"
einops = "*"
maturin = { version = "*", extras = ["patchelf"] }
ml_dtypes = "*"
scikit-learn = "<1.6.0"
tqdm = "*"
numpy = "*"
huggingface_hub = "*"

[tool.pixi.dependencies]
rust = "*"
uv = "*"
