version: 1.1
kind: operation
name: nanort-sigreg-sweep
description: >
  Legacy exploratory SIGReg col-only sweep; this is not the pre-registered paper
  matrix. Use plx_nanort_paper_sweep.yaml for the paper. The previous
  broad sweep did not beat baseline; col-only was the least harmful variant, so
  this tests smaller lambda_col values with 3 seeds each. Use success rate,
  censored time-to-target, and AUROC curves across seeds; do not average raw
  train/time_to_target when failures are logged as -1.
#
# Submit (uploads the local dir with -u; $HF_TOKEN speeds up artifact download):
#   polyaxon run -f plx_nanort_sigreg_sweep.yaml -u -P hf_token=$HF_TOKEN
#
# In W&B, group by (sigreg_layer, sigreg_lambda_row, sigreg_lambda_col) and
# compare success rate plus censored/conditional time-to-target against baseline.
matrix:
  kind: mapping
  concurrency: 3          # how many H200 runs at once; raise/lower as available
  values:
    # ── baseline (control) — SIGReg off ──────────────────────────────────────
    - {sigreg_layer: -1, sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.0,   seed: 0}
    - {sigreg_layer: -1, sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.0,   seed: 1}
    - {sigreg_layer: -1, sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.0,   seed: 2}
    # ── column view only, layer 0 ─────────────────────────────────────────────
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.002, seed: 0}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.002, seed: 1}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.002, seed: 2}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.003, seed: 0}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.003, seed: 1}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.003, seed: 2}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.005, seed: 0}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.005, seed: 1}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.005, seed: 2}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.01,  seed: 0}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.01,  seed: 1}
    - {sigreg_layer: 0,  sigreg_lambda_row: 0.0,   sigreg_lambda_col: 0.01,  seed: 2}
params:
  holdout_db:        {value: rel-avito}
  hf_artifacts_repo: {value: gabrielveloso/nanort-artifacts}
  optimizer:         {value: muon}
  muon_lr:           {value: 0.01}
  sigreg_n_proj:     {value: 64}
  sigreg_min_group:  {value: 8}
  val_eval_freq:     {value: 100}
  wandb_project:     {value: nanort-sigreg-sweep}
pathRef: ./plx_nanort_train.yaml
